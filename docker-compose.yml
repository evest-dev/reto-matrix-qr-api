services:
  fiber-api:
    build: ./fiber-api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      STATISTICS_API_URL: "http://express-api:4000"
    depends_on:
      express-api:
        condition: service_healthy
    networks:
      - matrix-net

  express-api:
    build: ./express-api
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
    networks:
      - matrix-net

networks:
  matrix-net:
    driver: bridge
